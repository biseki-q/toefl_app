<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL Build a Sentence Master</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase Standard Web SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseSDK = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
            getFirestore, doc, setDoc, getDoc, onSnapshot
        };
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .slot-box { transition: all 0.2s ease; }
        .slot-box.drag-over { border-color: #818cf8; background-color: rgba(99, 102, 241, 0.25); transform: scale(1.03); }
        .word-chip { touch-action: manipulation; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="app-root" class="max-w-3xl mx-auto px-4 py-6 min-h-screen flex flex-col justify-between"></div>

    <script>
        const SEED_QUESTIONS = [
            {
                id: "q1",
                prompt: "Why did the research team postpone publishing their findings?",
                prefix: "Hardly",
                suffix: "when new discrepancies in the data were discovered.",
                words: ["the", "had", "completed", "they", "analysis", "have"],
                correct: ["had", "they", "completed", "the", "analysis"],
                dummy: "have",
                translation: "彼らが分析を終えるか終えないかのうちに、データに新たな矛盾が発見された。",
                category: "倒置構文 (Inversion)",
                grammarPoint: "Hardly + had + S + p.p. ... when ~ （〜するとすぐに…した）",
                speedHack: "文頭が否定語『Hardly』で始まっているのを見た瞬間に、直後は『had they completed』という疑問文の語順（倒置）になると見抜くのが最速解法のキーです。"
            },
            {
                id: "q2",
                prompt: "Is Professor Harrison expected to attend the faculty symposium tomorrow?",
                prefix: "Had he",
                suffix: "the keynote speech instead of Dr. Vance.",
                words: ["been", "arrived", "earlier", "he", "would", "delivered", "have"],
                correct: ["arrived", "earlier", "he", "would", "have", "delivered"],
                dummy: "been",
                translation: "彼がもっと早く到着していたならば、ヴァンス博士の代わりに基調講演を行っていただろうに。",
                category: "仮定法過去完了のIf省略",
                grammarPoint: "Had + S + p.p.（Ifの省略による倒置）",
                speedHack: "Prefixの『Had he』を見たら仮定法過去完了のIf省略だと即断。後半の帰結節『he would have delivered』のV型を瞬時に繋げます。"
            },
            {
                id: "q3",
                prompt: "What caused the delay in completing the construction project?",
                prefix: "Under no circumstances",
                suffix: "without prior approval from the engineering department.",
                words: ["should", "the", "modified", "be", "plans", "have"],
                correct: ["should", "the", "plans", "be", "modified"],
                dummy: "have",
                translation: "いかなる状況であれ、工学部からの事前の承認なしに計画が変更されるべきではなかった。",
                category: "否定語句の前置による倒置",
                grammarPoint: "Under no circumstances + 助動詞 + S + V",
                speedHack: "『Under no circumstances』は強烈な否定フレーズ。助動詞『should』＋主語『the plans』を即座に並べます。"
            },
            {
                id: "q4",
                prompt: "How did the startup manage to secure additional funding so quickly?",
                prefix: "It was",
                suffix: "convinced the investors to double their initial contribution.",
                words: ["that", "innovative", "their", "strategy", "which", "marketing"],
                correct: ["their", "innovative", "marketing", "strategy", "that"],
                dummy: "which",
                translation: "投資家たちに初期出資額を倍増させたのは、まさに彼らの革新的なマーケティング戦略であった。",
                category: "強調構文 (It is ... that)",
                grammarPoint: "It is [強調したい名詞句] that/who + 残りの文",
                speedHack: "It was ... suffix(thatの役割のV) の構造から強調構文を見破り、主語となる名詞句『their innovative marketing strategy』を挟み込みます。"
            },
            {
                id: "q5",
                prompt: "Why was the proposal rejected by the board of directors?",
                prefix: "Having",
                suffix: "the committee decided to request a comprehensive revision.",
                words: ["thoroughly", "evaluated", "not", "risks", "the", "been"],
                correct: ["not", "been", "thoroughly", "evaluated", "the"],
                dummy: "risks",
                translation: "十分に評価されていなかったため、委員会は包括的な修正を要求することに決定した。",
                category: "分詞構文 (完了形・否定)",
                grammarPoint: "Not having + p.p. / Having not + p.p. （〜しなかったので）",
                speedHack: "『Having』から始まる完了形分詞構文。否定の『not』＋受動態『been thoroughly evaluated』をまとめるのがコツ。"
            },
            {
                id: "q6",
                prompt: "What accounted for the sudden drop in quarterly revenue?",
                prefix: "So severe",
                suffix: "that multiple branches were forced to close down.",
                words: ["was", "economic", "downturn", "the", "were", "it"],
                correct: ["was", "the", "economic", "downturn"],
                dummy: "were",
                translation: "景気後退は非常に深刻だったため、複数の支店が閉鎖に追い込まれた。",
                category: "So...that構文の倒置",
                grammarPoint: "So + 形容詞 + be動詞 + S + that...（非常に〜なので…）",
                speedHack: "文頭『So severe』は形容詞の強調倒置。直後に動詞『was』＋主語『the economic downturn』を置きます。"
            },
            {
                id: "q7",
                prompt: "How should we handle the unexpected software glitch during the demo?",
                prefix: "No matter how",
                suffix: "we must maintain a calm and professional demeanor.",
                words: ["may", "the", "situation", "complicated", "seem", "is"],
                correct: ["complicated", "the", "situation", "may", "seem"],
                dummy: "is",
                translation: "状況がどれほど複雑に見えようとも、私たちは冷静でプロフェッショナルな態度を保たなければならない。",
                category: "複合関係詞 (No matter how)",
                grammarPoint: "No matter how + 形容詞/副詞 + S + V",
                speedHack: "『No matter how』の直後には必ず形容詞/副詞『complicated』が吸い寄せられます。"
            },
            {
                id: "q8",
                prompt: "What was the result of the environmental compliance audit?",
                prefix: "The auditor recommended that the facility",
                suffix: "its waste management procedures immediately.",
                words: ["upgrade", "should", "upgrades", "to", "be"],
                correct: ["upgrade"],
                dummy: "upgrades",
                translation: "監査人は、施設が直ちに廃棄物管理手順をアップグレードすることを勧告した。",
                category: "提案・要求のthat節（仮定法現在）",
                grammarPoint: "recommend that + S + (should) + 動詞の原形",
                speedHack: "『recommended that』の後ろの節では三単現のsがつかず、動詞の原形『upgrade』が来ます。"
            },
            {
                id: "q9",
                prompt: "Did the team notice any flaws in the experimental design?",
                prefix: "Seldom",
                suffix: "such a dramatic breakthrough in such a short timeframe.",
                words: ["have", "researchers", "witnessed", "has", "they", "were"],
                correct: ["have", "researchers", "witnessed"],
                dummy: "has",
                translation: "研究者たちがこれほど短期間でこれほど劇的な飛躍的進歩を目撃することは滅多にない。",
                category: "準否定語による倒置 (Seldom)",
                grammarPoint: "Seldom + 助動詞/have + S + p.p.",
                speedHack: "『Seldom』は準否定語。助動詞『have』＋複数が主語『researchers』＋『witnessed』と続きます。"
            },
            {
                id: "q10",
                prompt: "How did the non-profit organization expand its reach last year?",
                prefix: "Not only",
                suffix: "but it also established new international chapters.",
                words: ["did", "it", "raise", "funds", "raised", "substantial"],
                correct: ["did", "it", "raise", "substantial", "funds"],
                dummy: "raised",
                translation: "その非営利団体は多額の資金を調達しただけでなく、新たな国際支部も設立した。",
                category: "Not only ... but also 倒置",
                grammarPoint: "Not only + 助動詞(did) + S + V(原形) ... but also ~",
                speedHack: "文頭『Not only』で節が始まる場合、疑問文順『did it raise』の形になります。"
            }
        ];

        let state = {
            activeTab: 'quiz',
            syncPin: localStorage.getItem('toefl_app_pin') || '',
            pinInput: '',
            isPinModalOpen: !localStorage.getItem('toefl_app_pin'),
            currentIdx: 0,
            slots: [],
            bankWords: [],
            isSubmitted: false,
            isCorrect: false,
            elapsedSeconds: 0,
            timerInterval: null,
            draggedWord: null,
            draggedFromIndex: null,
            draggedSourceType: null,
            userAnswers: JSON.parse(localStorage.getItem('toefl_answers_local') || '[]'),
            questionsQueue: [],
            isGeneratingQuestion: false,
            showMilestoneModal: false,
            milestoneCount: 0
        };

        let firebaseApp = null;
        let firebaseDb = null;
        let firebaseAuth = null;
        let firebaseUser = null;
        let unsubscribeFirestore = null;

        async function initFirebaseSync() {
            if (!window.FirebaseSDK || !state.syncPin) return;

            try {
                const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, doc, onSnapshot } = window.FirebaseSDK;
                const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { apiKey: "demo", projectId: "toefl-builder-app" };
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-toefl-app';

                if (!firebaseApp) {
                    firebaseApp = initializeApp(firebaseConfig);
                    firebaseAuth = getAuth(firebaseApp);
                    firebaseDb = getFirestore(firebaseApp);

                    const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                    if (initialToken) {
                        const userCred = await signInWithCustomToken(firebaseAuth, initialToken);
                        firebaseUser = userCred.user;
                    } else {
                        const userCred = await signInAnonymously(firebaseAuth);
                        firebaseUser = userCred.user;
                    }
                }

                if (!firebaseUser) return;

                if (unsubscribeFirestore) unsubscribeFirestore();

                const docRef = doc(firebaseDb, 'artifacts', appId, 'public', 'data', 'user_pins', state.syncPin);
                unsubscribeFirestore = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data && Array.isArray(data.answers)) {
                            state.userAnswers = data.answers;
                            localStorage.setItem('toefl_answers_local', JSON.stringify(data.answers));
                            render();
                        }
                    }
                }, (error) => {
                    console.log("Firestore sync listener info:", error);
                });
            } catch (err) {
                console.log("Firebase sync setup:", err);
            }
        }

        async function saveAnswers(updated) {
            state.userAnswers = updated;
            localStorage.setItem('toefl_answers_local', JSON.stringify(updated));

            if (!state.syncPin || !window.FirebaseSDK || !firebaseUser || !firebaseDb) return;

            try {
                const { doc, setDoc } = window.FirebaseSDK;
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-toefl-app';
                const docRef = doc(firebaseDb, 'artifacts', appId, 'public', 'data', 'user_pins', state.syncPin);

                await setDoc(docRef, {
                    answers: updated,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
            } catch(e) {
                console.log("Save answers error:", e);
            }
        }

        function handleSetPin(pin) {
            const clean = (pin || '').trim();
            if (!clean) return;
            state.syncPin = clean;
            state.isPinModalOpen = false;
            localStorage.setItem('toefl_app_pin', clean);
            initFirebaseSync();
            render();
        }

        function getIconSVG(name, className = "w-5 h-5") {
            const icons = {
                "check-circle": '<path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zM9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
                "x-circle": '<path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm-3-3l6-6m0 6l-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
                "clock": '<path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-14v6l4 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
                "sparkles": '<path d="M12 3l1.912 5.813a2 2 0 001.275 1.275L21 12l-5.813 1.912a2 2 0 00-1.275 1.275L12 21l-1.912-5.813a2 2 0 00-1.275-1.275L3 12l5.813-1.912a2 2 0 00-1.275-1.275L12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
                "arrow-right": '<path d="M5 12h14m-7-7l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
                "target": '<path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10zm0-6a4 4 0 100-8 4 4 0 000 8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
                "cloud": '<path d="M17.5 19a4.5 4.5 0 002.09-8.58A6 6 0 007.82 8.05 5 5 0 004 13a5 5 0 005 5h8.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
            };
            return `<svg viewBox="0 0 24 24" class="${className}">${icons[name] || ''}</svg>`;
        }

        function createProceduralQuestion() {
            const templates = [
                {
                    prompt: "Why was the executive board hesitant to approve the merger?",
                    prefix: "Only after",
                    suffix: "did the board agree to sign the contract.",
                    words: ["conducting", "audits", "financial", "rigorous", "they", "conducted"],
                    correct: ["conducting", "rigorous", "financial", "audits"],
                    dummy: "conducted",
                    translation: "厳格な財務監査を実施した後に初めて、取締役会は契約に署名することに同意した。",
                    category: "Only after 倒置構文",
                    grammarPoint: "Only after + 動名詞/節 + 助動詞 + S + V",
                    speedHack: "『Only after』の直後には動名詞句『conducting rigorous financial audits』が続き、その後の主節で倒置が起きます。"
                },
                {
                    prompt: "Will the new solar power grid be operational by next month?",
                    prefix: "Were the team to",
                    suffix: "we could launch the grid ahead of schedule.",
                    words: ["complete", "testing", "final", "the", "completed", "today"],
                    correct: ["complete", "the", "final", "testing"],
                    dummy: "completed",
                    translation: "チームが本日最終テストを完了させることがあれば、予定より早くグリッドを立ち上げることができるだろう。",
                    category: "仮定法現在のWere to省略倒置",
                    grammarPoint: "Were + S + to + V（If S were to V の省略倒置）",
                    speedHack: "文頭『Were the team to』から『Were + S + to + 動詞の原形』の仮定法パターンを即座に特定します。"
                },
                {
                    prompt: "What made the keynote lecture so memorable for the audience?",
                    prefix: "Rarely have",
                    suffix: "such a compelling argument for sustainable urban development.",
                    words: ["attendants", "heard", "listeners", "was", "presents", "ever"],
                    correct: ["listeners", "ever", "heard"],
                    dummy: "presents",
                    translation: "聴衆が持続可能な都市開発についてのこれほど説得力のある議論を耳にすることは滅多にない。",
                    category: "準否定語 (Rarely) の倒置",
                    grammarPoint: "Rarely + have + S + p.p. （滅多に〜ない）",
                    speedHack: "文頭『Rarely have』の後は『主語 (listeners) + 副詞 (ever) + 過去分詞 (heard)』を繋げるのが鉄則です。"
                },
                {
                    prompt: "Why was the proposal deferred to the next session?",
                    prefix: "Not until",
                    suffix: "did the committee decide to resume deliberations.",
                    words: ["all", "were", "clarified", "issues", "they", "was"],
                    correct: ["all", "issues", "were", "clarified"],
                    dummy: "was",
                    translation: "すべての問題が解明されて初めて、委員会は審議を再開することに決定した。",
                    category: "Not until 倒置構文",
                    grammarPoint: "Not until + 節/句 + 助動詞 + S + V",
                    speedHack: "『Not until』の直後には従属節『all issues were clarified』を順送りで並べ、その後の主節で倒置『did the committee...』に繋ぎます。"
                }
            ];
            const base = templates[Math.floor(Math.random() * templates.length)];
            const cloned = JSON.parse(JSON.stringify(base));
            cloned.id = "gen_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
            return cloned;
        }

        function getFreshQuestionsQueue() {
            const answeredIds = new Set((state.userAnswers || []).map(a => a.questionId));
            // 解答済みの問題と未解答の問題を分離
            const unaskedSeed = SEED_QUESTIONS.filter(q => !answeredIds.has(q.id)).sort(() => Math.random() - 0.5);
            const askedSeed = SEED_QUESTIONS.filter(q => answeredIds.has(q.id)).sort(() => Math.random() - 0.5);
            
            // 未解答優先 ➔ 回答済み ➔ 動的生成問題を混ぜてランダム順にする
            const baseQueue = [...unaskedSeed, ...askedSeed];
            for (let i = 0; i < 3; i++) {
                baseQueue.push(createProceduralQuestion());
            }
            return baseQueue.sort(() => Math.random() - 0.5);
        }

        async function generateMoreQuestionsAI() {
            if (state.isGeneratingQuestion) return;
            state.isGeneratingQuestion = true;

            try {
                const promptText = "Generate 1 difficult TOEFL Build a Sentence question for target 100+ score. Return JSON with fields: prompt, prefix, suffix, words (array of strings including 1 dummy), correct (array of strings in correct order), dummy (single string word), translation (Japanese), category (Grammar topic), grammarPoint, speedHack.";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }],
                        generationConfig: {
                            responseMimeType: "application/json"
                        }
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text) {
                        const parsed = JSON.parse(text);
                        if (parsed.prompt && parsed.correct && Array.isArray(parsed.correct)) {
                            parsed.id = "ai_" + Date.now();
                            state.questionsQueue.push(parsed);
                            state.isGeneratingQuestion = false;
                            return;
                        }
                    }
                }
            } catch (err) {
                console.log("Gemini API fallback to procedural", err);
            }

            const fallback = createProceduralQuestion();
            state.questionsQueue.push(fallback);
            state.isGeneratingQuestion = false;
        }

        function initQuestion(idx) {
            if (!state.questionsQueue || state.questionsQueue.length === 0) {
                state.questionsQueue = getFreshQuestionsQueue();
            }

            if (!state.questionsQueue[idx]) {
                const fallback = createProceduralQuestion();
                state.questionsQueue.push(fallback);
            }

            const q = state.questionsQueue[idx];
            if (!q) return;

            state.slots = Array(q.correct.length).fill(null);
            state.bankWords = [...q.words].sort(() => Math.random() - 0.5);
            state.isSubmitted = false;
            state.isCorrect = false;
            state.elapsedSeconds = 0;

            if (state.timerInterval) clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                if (!state.isSubmitted && !state.showMilestoneModal) {
                    state.elapsedSeconds++;
                    updateTimerUI();
                }
            }, 1000);

            if (state.questionsQueue.length - idx <= 2) {
                generateMoreQuestionsAI();
            }

            render();
        }

        function placeWordInSlot(word, sourceIdx, targetSlotIdx, sourceType) {
            if (state.isSubmitted || !word) return;

            if (sourceType === 'bank') {
                const existingInSlot = state.slots[targetSlotIdx];
                state.slots[targetSlotIdx] = word;
                state.bankWords.splice(sourceIdx, 1);
                if (existingInSlot) {
                    state.bankWords.push(existingInSlot);
                }
            } else if (sourceType === 'slot') {
                const existingInSlot = state.slots[targetSlotIdx];
                state.slots[targetSlotIdx] = word;
                state.slots[sourceIdx] = existingInSlot;
            }

            render();
        }

        function removeFromSlot(sIdx) {
            if (state.isSubmitted) return;
            const word = state.slots[sIdx];
            if (!word) return;

            state.slots[sIdx] = null;
            state.bankWords.push(word);
            render();
        }

        function handleTapBankWord(word, bIdx) {
            if (state.isSubmitted) return;
            const emptyIdx = state.slots.findIndex(s => s === null);
            if (emptyIdx !== -1) {
                placeWordInSlot(word, bIdx, emptyIdx, 'bank');
            }
        }

        function handleSubmit() {
            if (state.slots.includes(null)) {
                alert("すべてのスロットに単語を配置してください！");
                return;
            }
            state.isSubmitted = true;
            if (state.timerInterval) clearInterval(state.timerInterval);

            const q = state.questionsQueue[state.currentIdx];
            const isRight = state.slots.every((w, i) => w === q.correct[i]);
            state.isCorrect = isRight;

            const newRecord = {
                questionId: q.id,
                category: q.category,
                isCorrect: isRight,
                timeSeconds: state.elapsedSeconds,
                timestamp: new Date().toISOString()
            };

            const updated = [newRecord, ...state.userAnswers];
            saveAnswers(updated);

            if (updated.length > 0 && updated.length % 10 === 0) {
                state.milestoneCount = updated.length;
                state.showMilestoneModal = true;
            }

            render();
        }

        function handleNext() {
            state.currentIdx++;
            initQuestion(state.currentIdx);
        }

        function closeMilestoneModal() {
            state.showMilestoneModal = false;
            render();
        }

        function updateTimerUI() {
            const timerEl = document.getElementById('timer-display');
            if (timerEl) {
                const over = state.elapsedSeconds > 35;
                timerEl.className = `font-mono text-sm font-bold ${over ? "text-rose-400 animate-pulse" : "text-indigo-300"}`;
                timerEl.innerText = over ? `+${state.elapsedSeconds - 35}s OVER` : `${35 - state.elapsedSeconds}s`;
            }
        }

        function render() {
            const root = document.getElementById('app-root');
            if (!root) return;

            const q = state.questionsQueue[state.currentIdx] || SEED_QUESTIONS[0];

            const totalAnswered = state.userAnswers.length;
            const correctCount = state.userAnswers.filter(a => a.isCorrect).length;
            const accuracy = totalAnswered > 0 ? Math.round((correctCount / totalAnswered) * 100) : 0;
            const avgTime = totalAnswered > 0 ? Math.round(state.userAnswers.reduce((acc, c) => acc + c.timeSeconds, 0) / totalAnswered) : 0;

            let html = `
                <div>
                    <!-- PIN MODAL -->
                    ${state.isPinModalOpen ? `
                        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full shadow-2xl">
                                <div class="flex items-center gap-3 mb-4 text-indigo-400">
                                    ${getIconSVG('cloud', 'w-8 h-8')}
                                    <h2 class="text-xl font-bold text-white">クラウド同期PINコード</h2>
                                </div>
                                <p class="text-sm text-slate-300 mb-6">
                                    PC・スマホ間で学習データを自動同期するための<br/>
                                    <span class="text-indigo-400 font-semibold">4桁の暗証番号（PIN）</span>を入力してください。
                                </p>
                                <input 
                                    type="text" 
                                    id="pin-input-field"
                                    maxLength="8"
                                    placeholder="例: 7777"
                                    value="${state.pinInput}"
                                    class="w-full bg-slate-950 border border-slate-700 text-center text-2xl font-mono tracking-widest text-white py-3 rounded-xl mb-4 focus:border-indigo-500 focus:outline-none"
                                />
                                <button 
                                    onclick="handleSetPin(document.getElementById('pin-input-field').value)"
                                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg"
                                >
                                    同期を開始してアプリを開く
                                </button>
                            </div>
                        </div>
                    ` : ''}

                    <!-- APP HEADER -->
                    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-6 bg-slate-900/80 p-4 rounded-2xl border border-slate-800 backdrop-blur">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-md border border-indigo-500/20">
                                    TOEFL 2026 Writing • 無限特訓
                                </span>
                                <span class="text-xs text-slate-400 font-mono">PIN: ${state.syncPin || '未設定'}</span>
                            </div>
                            <h1 class="text-lg font-bold text-white mt-1">Build a Sentence Master</h1>
                        </div>

                        <div class="flex items-center gap-2 self-end sm:self-auto">
                            <button 
                                onclick="state.activeTab = 'quiz'; render();"
                                class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${state.activeTab === 'quiz' ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-800 text-slate-400 hover:text-white'}"
                            >
                                ${getIconSVG('target', 'w-4 h-4')} 演習特訓
                            </button>
                            <button 
                                onclick="state.activeTab = 'advisor'; render();"
                                class="px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${state.activeTab === 'advisor' ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-800 text-slate-400 hover:text-white'}"
                            >
                                ${getIconSVG('sparkles', 'w-4 h-4')} AIアドバイザー
                            </button>
                        </div>
                    </header>

                    <!-- MILESTONE / COOL-DOWN MODAL -->
                    ${state.showMilestoneModal ? `
                        <div class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div class="bg-slate-900 border border-indigo-500/40 rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-5 animate-in fade-in zoom-in duration-200">
                                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                                    <div class="flex items-center gap-2 text-indigo-400">
                                        ${getIconSVG('sparkles', 'w-6 h-6')}
                                        <h3 class="text-lg font-bold text-white">${state.milestoneCount}問達成！中間セッション分析</h3>
                                    </div>
                                    <span class="text-xs bg-indigo-500/20 text-indigo-300 font-mono font-bold px-2.5 py-1 rounded-full">
                                        Cool-down
                                    </span>
                                </div>

                                <p class="text-xs text-slate-300 leading-relaxed">
                                    お疲れ様です！10問の演習ブロックが完了しました。脳の疲労を防ぎ、集中力を維持するためにクールタイム（休憩）を取りましょう。
                                </p>

                                <div class="grid grid-cols-2 gap-3">
                                    <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 text-center">
                                        <p class="text-xs text-slate-400">直近10問の正解率</p>
                                        <p class="text-2xl font-bold font-mono text-emerald-400 mt-1">
                                            ${Math.round((state.userAnswers.slice(0, 10).filter(a => a.isCorrect).length / Math.min(10, state.userAnswers.length)) * 100)}%
                                        </p>
                                    </div>
                                    <div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800 text-center">
                                        <p class="text-xs text-slate-400">平均解答時間</p>
                                        <p class="text-2xl font-bold font-mono text-indigo-400 mt-1">
                                            ${Math.round(state.userAnswers.slice(0, 10).reduce((acc, c) => acc + c.timeSeconds, 0) / Math.min(10, state.userAnswers.length))}s
                                        </p>
                                    </div>
                                </div>

                                <div class="bg-indigo-950/40 border border-indigo-500/30 p-4 rounded-xl text-xs space-y-2 text-indigo-200">
                                    <p class="font-bold text-indigo-300 flex items-center gap-1">
                                        ${getIconSVG('target', 'w-4 h-4')} 次の特訓に向けた戦略アドバイス:
                                    </p>
                                    <p>
                                        1問あたり15〜20秒以内での即答率を高めるため、文頭のキーとなる構文標識（倒置否定語、Having等）が見えた瞬間に後半の動詞ブロックまで一気に固める意識を持ちましょう。
                                    </p>
                                </div>

                                <div class="flex items-center gap-3 pt-2">
                                    <button 
                                        onclick="closeMilestoneModal()"
                                        class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm"
                                    >
                                        演習を再開する（次の問題へ）
                                    </button>
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <!-- TAB 1: QUIZ -->
                    ${state.activeTab === 'quiz' ? `
                        <div class="space-y-6">
                            <!-- STATUS BAR -->
                            <div class="flex justify-between items-center bg-slate-900/40 p-3 rounded-xl border border-slate-800/80">
                                <div class="flex items-center gap-2">
                                    <span class="px-3 py-1 bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 text-xs font-bold rounded-full">
                                        Question ${state.currentIdx + 1}
                                    </span>
                                    <span class="text-xs text-slate-400">
                                        (累計解答数: ${totalAnswered}問)
                                    </span>
                                    ${state.isSubmitted ? `
                                        <span class="text-xs font-semibold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2.5 py-0.5 rounded-full">
                                            ${q ? q.category : ''}
                                        </span>
                                    ` : ''}
                                </div>

                                <div class="flex items-center gap-2">
                                    ${getIconSVG('clock', 'w-4 h-4 text-slate-400')}
                                    <span id="timer-display" class="font-mono text-sm font-bold ${state.elapsedSeconds > 35 ? "text-rose-400 animate-pulse" : "text-indigo-300"}">
                                        ${state.elapsedSeconds <= 35 ? `${35 - state.elapsedSeconds}s` : `+${state.elapsedSeconds - 35}s OVER`}
                                    </span>
                                </div>
                            </div>

                            <!-- SPEAKER PROMPT -->
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                <p class="text-xs text-indigo-400 font-semibold mb-1">Speaker A:</p>
                                <p class="text-slate-200 text-base font-medium">"${q.prompt}"</p>
                            </div>

                            <!-- SLOT BOXES AREA -->
                            <div class="bg-slate-900/60 border border-slate-800 p-5 rounded-2xl space-y-3">
                                <p class="text-xs text-slate-400">
                                    単語をドラッグ＆ドロップ、またはタップして下線スロットに配置してください：
                                </p>

                                <div class="flex flex-wrap gap-2 items-center text-slate-200 font-medium leading-loose pt-2">
                                    <span class="text-indigo-300 font-semibold">${q.prefix}</span>

                                    ${state.slots.map((word, sIdx) => `
                                        <div
                                            ondragover="event.preventDefault(); this.classList.add('drag-over');"
                                            ondragleave="this.classList.remove('drag-over');"
                                            ondrop="
                                                event.preventDefault();
                                                this.classList.remove('drag-over');
                                                if (state.draggedWord !== null) {
                                                    placeWordInSlot(state.draggedWord, state.draggedFromIndex, ${sIdx}, state.draggedSourceType);
                                                }
                                            "
                                            onclick="removeFromSlot(${sIdx})"
                                            draggable="${word ? 'true' : 'false'}"
                                            ondragstart="
                                                state.draggedWord = '${word || ''}';
                                                state.draggedFromIndex = ${sIdx};
                                                state.draggedSourceType = 'slot';
                                            "
                                            class="slot-box min-w-[85px] h-10 px-3 border-b-2 flex items-center justify-center text-sm font-bold rounded-t-lg transition cursor-pointer select-none ${
                                                word 
                                                    ? "bg-indigo-600/20 border-indigo-500 text-indigo-200 shadow-sm" 
                                                    : "bg-slate-950/80 border-slate-700 text-slate-600 hover:border-slate-500"
                                            }"
                                        >
                                            ${word || `<span class="text-xs font-normal text-slate-600">(${sIdx + 1})</span>`}
                                        </div>
                                    `).join('')}

                                    <span class="text-indigo-300 font-semibold">${q.suffix}</span>
                                </div>
                            </div>

                            <!-- WORD BANK -->
                            <div class="bg-slate-900/40 border border-slate-800/80 p-4 rounded-2xl">
                                <p class="text-xs text-slate-400 mb-3">使用できる単語（不要なダミーが1つ含まれています）：</p>
                                <div class="flex flex-wrap gap-2">
                                    ${state.bankWords.map((word, bIdx) => `
                                        <div
                                            draggable="${!state.isSubmitted}"
                                            ondragstart="
                                                state.draggedWord = '${word}';
                                                state.draggedFromIndex = ${bIdx};
                                                state.draggedSourceType = 'bank';
                                            "
                                            onclick="handleTapBankWord('${word}', ${bIdx})"
                                            class="word-chip bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium text-sm px-3.5 py-2 rounded-xl cursor-pointer active:scale-95 transition select-none shadow-sm"
                                        >
                                            ${word}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- SUBMIT / FEEDBACK -->
                            ${!state.isSubmitted ? `
                                <button
                                    onclick="handleSubmit()"
                                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-2xl transition shadow-lg shadow-indigo-600/20 active:scale-[0.99]"
                                >
                                    回答を送信する
                                </button>
                            ` : `
                                <div class="space-y-4">
                                    <div class="p-5 rounded-2xl border flex items-start gap-3 ${state.isCorrect ? "bg-emerald-500/10 border-emerald-500/30 text-emerald-300" : "bg-rose-500/10 border-rose-500/30 text-rose-300"}">
                                        ${getIconSVG(state.isCorrect ? "check-circle" : "x-circle", "w-6 h-6 shrink-0 mt-0.5")}
                                        <div class="flex-1">
                                            <div class="font-bold text-base flex justify-between items-center">
                                                <span>${state.isCorrect ? "正解！ Excellent!" : "不正解..."}</span>
                                                <span class="text-xs font-mono text-slate-400">Time: ${state.elapsedSeconds}s</span>
                                            </div>

                                            <div class="mt-3 text-sm text-slate-200 bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 space-y-1.5">
                                                <div>
                                                    <span class="text-indigo-400 font-bold">模範解答: </span>
                                                    <span class="font-medium">${q.prefix} ${q.correct.join(" ")} ${q.suffix}</span>
                                                </div>
                                                <div class="text-xs text-slate-300 pt-1.5 border-t border-slate-800">
                                                    <span class="text-emerald-400 font-bold">日本語訳: </span>
                                                    ${q.translation}
                                                </div>
                                                ${!state.isCorrect ? `
                                                    <div class="text-xs text-rose-400 pt-1">
                                                        <span class="font-bold">ダミー単語: </span>「${q.dummy}」
                                                    </div>
                                                ` : ''}
                                            </div>

                                            <div class="mt-3 space-y-2 text-xs">
                                                <div class="bg-indigo-950/40 border border-indigo-500/20 p-3 rounded-xl text-indigo-200">
                                                    <p class="font-bold text-indigo-400 mb-1 flex items-center gap-1">
                                                        ${getIconSVG('sparkles', 'w-3.5 h-3.5')} 15秒で解くための時短のコツ (Speed Hack):
                                                    </p>
                                                    <p>${q.speedHack}</p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <button
                                        onclick="handleNext()"
                                        class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 rounded-2xl transition shadow-lg flex items-center justify-center gap-2"
                                    >
                                        次の問題へ進む ${getIconSVG('arrow-right', 'w-5 h-5')}
                                    </button>
                                </div>
                            `}
                        </div>
                    ` : ''}

                    <!-- TAB 2: AI ADVISOR -->
                    ${state.activeTab === 'advisor' ? `
                        <div class="space-y-6">
                            <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                                <div class="flex items-center gap-3">
                                    ${getIconSVG('cloud', 'w-6 h-6 text-indigo-400')}
                                    <div>
                                        <p class="text-xs text-slate-400">現在の同期PINコード</p>
                                        <p class="text-base font-bold font-mono text-white">${state.syncPin || '未設定'}</p>
                                    </div>
                                </div>
                                <button 
                                    onclick="state.isPinModalOpen = true; render();"
                                    class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-300"
                                >
                                    PINを変更
                                </button>
                            </div>

                            <div class="grid grid-cols-3 gap-3">
                                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl text-center">
                                    <p class="text-xs text-slate-400 mb-1">総解答数</p>
                                    <p class="text-2xl font-bold font-mono text-white">${totalAnswered}</p>
                                </div>
                                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl text-center">
                                    <p class="text-xs text-slate-400 mb-1">正解率</p>
                                    <p class="text-2xl font-bold font-mono text-emerald-400">${accuracy}%</p>
                                </div>
                                <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl text-center">
                                    <p class="text-xs text-slate-400 mb-1">平均解答時間</p>
                                    <p class="text-2xl font-bold font-mono text-indigo-400">${avgTime}s</p>
                                </div>
                            </div>

                            <div class="bg-gradient-to-r from-indigo-900/50 to-slate-900 border border-indigo-500/30 p-5 rounded-2xl">
                                <div class="flex justify-between items-center mb-2">
                                    <h3 class="text-sm font-bold text-indigo-300">TOEFL Writing 推定スコア到達度</h3>
                                    <span class="text-xs bg-indigo-500/20 text-indigo-300 px-2.5 py-0.5 rounded-full font-bold">
                                        目標: 100点超え
                                    </span>
                                </div>
                                <p class="text-2xl font-bold text-white mb-2">
                                    ${accuracy >= 85 && avgTime <= 25 ? "28 - 30 点 (目標達成圏内)" : 
                                     accuracy >= 70 ? "24 - 27 点 (あと一歩)" : "20 - 23 点 (要速読特訓)"}
                                </p>
                                <p class="text-xs text-slate-300 leading-relaxed">
                                    Build a Sentence セクションで1問15〜20秒で完答できるようになると、後半のAcademic Discussionなどのライティングにより多くの推敲時間を残せます。
                                </p>
                            </div>
                        </div>
                    ` : ''}
                </div>

                <footer class="mt-8 text-center text-xs text-slate-600">
                    TOEFL Build a Sentence Master • Multi-device Cloud Sync Ready
                </footer>
            `;

            root.innerHTML = html;
        }

        window.onload = function() {
            initFirebaseSync();
            state.questionsQueue = getFreshQuestionsQueue();
            initQuestion(state.currentIdx);
        };
    </script>
</body>
</html>
